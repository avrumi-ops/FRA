    <style>
      :root{--bg:#EEF2F6; --surface:#FFFFFF; --surface-2:#F5F8FB; --ink:#13202E; --muted:#58697B; --line:#D3DCE6; --accent:#1D5BBF; --accent-ink:#FFFFFF; --accent-soft:#E2ECFA; --ok:#0C7547; --ok-soft:#E0F2E9; --warn:#8F5600; --warn-soft:#FFF0D2; --bad:#B3261E; --bad-soft:#FCE6E3; --display:'Barlow Condensed','Arial Narrow',Arial,sans-serif; --body:'Barlow',system-ui,-apple-system,'Segoe UI',Arial,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace; --paper:#FFFFFF; --paper-ink:#111111; --shadow:0 1px 2px rgba(19,32,46,.08),0 8px 24px rgba(19,32,46,.07)}
      @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0E1620; --surface:#162130; --surface-2:#1B2839; --ink:#E6EDF5; --muted:#92A3B6; --line:#2B3A4D; --accent:#74A8F4; --accent-ink:#0B1626; --accent-soft:#1B2E4A; --ok:#4FC48C; --ok-soft:#133126; --warn:#F0B54E; --warn-soft:#33270F; --bad:#FF8A80; --bad-soft:#3A1816; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
      :root[data-theme="dark"]{--bg:#0E1620; --surface:#162130; --surface-2:#1B2839; --ink:#E6EDF5; --muted:#92A3B6; --line:#2B3A4D; --accent:#74A8F4; --accent-ink:#0B1626; --accent-soft:#1B2E4A; --ok:#4FC48C; --ok-soft:#133126; --warn:#F0B54E; --warn-soft:#33270F; --bad:#FF8A80; --bad-soft:#3A1816; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}
      *{box-sizing:border-box} body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);font-variant-numeric:tabular-nums} button,input,select,textarea{font:inherit;color:inherit} :focus-visible{outline:2px solid var(--accent);outline-offset:2px} .wrap{max-width:1280px;margin:0 auto;padding-block:16px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
      .top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-bottom:14px}.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}.mark{width:38px;height:38px;flex:none}.brand h1{margin:0;font:700 26px/1 var(--display);letter-spacing:.02em;text-transform:uppercase}.brand small{display:block;color:var(--muted);font-size:12.5px;letter-spacing:.02em;margin-top:3px}.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}.tabs button{border:0;background:none;padding:7px 16px;border-radius:8px;cursor:pointer;font:600 14px var(--body);color:var(--muted)}.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}.tools{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px;line-height:1.3}.btn:hover{border-color:var(--accent)}.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.btn.ghost{background:none}.btn:disabled{opacity:.55;cursor:default}.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--accent-soft);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:14px}.bar p{margin:0;flex:1 1 260px;min-width:0}.bar.warn{background:var(--warn-soft)}
      .work{display:grid;grid-template-columns:272px minmax(0,1fr);gap:20px;align-items:start}.rail{position:sticky;top:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0}.rail .prog{padding:6px 8px 10px;border-bottom:1px solid var(--line);margin-bottom:6px}.rail .prog b{font:600 13px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.meter{height:6px;border-radius:3px;background:var(--line);margin-top:6px;overflow:hidden}.meter i{display:block;height:100%;background:var(--ok);width:0}.ri{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;padding:8px;border-radius:8px;cursor:pointer;min-width:0}.ri:hover{background:var(--surface-2)}.ri[aria-current="step"]{background:var(--accent-soft)}.ri .n{font:500 12.5px var(--mono);color:var(--muted);width:22px;flex:none}.ri .l{flex:1;min-width:0;font-weight:500;line-height:1.25}.ri .c{font-size:12px;color:var(--muted);flex:none}.chip{display:inline-block;padding:1px 8px;border-radius:99px;font:600 12px var(--body);white-space:nowrap}.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.neutral{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
      .panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px clamp(14px,3vw,28px);min-width:0}.panel h2{margin:0 0 4px;font:700 30px/1.1 var(--display);letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}.panel h3{margin:26px 0 10px;font:600 18px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}.lede{color:var(--muted);margin:6px 0 18px;max-width:68ch}.lede p{margin:0 0 6px}.steps-nav{display:flex;justify-content:space-between;gap:10px;margin-top:26px;padding-top:16px;border-top:1px solid var(--line)}
      .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.f{display:flex;flex-direction:column;gap:4px;min-width:0}.f.wide{grid-column:1/-1}.f label{font:600 12.5px var(--body);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:8px 10px;min-width:0;width:100%}.f textarea{min-height:68px;resize:vertical}.ai{border:1px dashed var(--accent);background:var(--accent-soft);border-radius:12px;padding:14px 16px;margin-bottom:8px}.ai h3{margin:0 0 4px;color:var(--ink);font-size:17px}.ai textarea{width:100%;min-height:96px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;margin:8px 0;resize:vertical}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.msg{color:var(--muted);font-size:14px;min-width:0;overflow-wrap:anywhere}.msg.err{color:var(--bad)}.photo{display:flex;flex-wrap:wrap;gap:14px;align-items:center}.photo img{width:160px;max-width:100%;border-radius:8px;border:1px solid var(--line)}
      .q{display:grid;grid-template-columns:3.4rem minmax(0,1fr) auto;gap:6px 12px;padding:12px 0;border-top:1px solid var(--line);align-items:start}.q:first-of-type{border-top:0}.qid{font:500 13px var(--mono);color:var(--muted);padding-top:3px}.qt{min-width:0;overflow-wrap:anywhere}.qa{display:flex;flex-direction:column;align-items:flex-end;gap:6px}.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface-2)}.seg button{border:0;border-right:1px solid var(--line);background:none;padding:6px 12px;cursor:pointer;font-weight:500;font-size:14px}.seg button:last-child{border-right:0}.seg button:hover{background:var(--accent-soft)}.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}.q.good .seg button[aria-pressed="true"]{background:var(--ok);color:var(--surface)}.q.bad .seg button[aria-pressed="true"]{background:var(--bad);color:var(--surface)}.qtext{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:6px 10px;width:min(300px,100%)}.qx{grid-column:2/-1;display:flex;flex-direction:column;gap:6px;min-width:0}.qnote{border:1px solid transparent;background:none;border-bottom:1px dashed var(--line);padding:3px 2px;width:100%;color:var(--muted);font-size:14px}.qnote:focus{border-color:var(--accent);background:var(--surface-2);border-radius:6px;color:var(--ink)}.hint{font-size:14px;border-radius:8px;padding:7px 10px;display:flex;gap:8px;align-items:flex-start;background:var(--warn-soft);color:var(--ink)}.hint.s3,.hint.s4{background:var(--bad-soft)}.hint b{flex:none;font:600 12px var(--display);letter-spacing:.08em;text-transform:uppercase;padding-top:2px}.tag{font:600 11px var(--body);letter-spacing:.05em;text-transform:uppercase;background:var(--accent-soft);color:var(--accent);padding:1px 6px;border-radius:4px;margin-left:6px;white-space:nowrap}
      .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:14px 0}.stat{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surface-2)}.stat span{display:block;font:600 12px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}.stat b{font:700 28px/1.2 var(--display);letter-spacing:.02em}.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px}.tbl table{border-collapse:collapse;width:100%;min-width:520px}.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.tbl th{font:600 12px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface-2)}.tbl tr:last-child td{border-bottom:0}.tbl select,.tbl textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:5px 8px;width:100%}.tbl textarea{min-height:58px;resize:vertical}.empty{padding:18px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);text-align:center}.link{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;text-decoration:underline;font-weight:500}
      .tb{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}.paper-wrap{overflow-x:auto;padding:4px 0}.paper{background:var(--paper);color:var(--paper-ink);width:min(100%,820px);margin:0 auto;padding:44px 48px;box-shadow:var(--shadow);border-radius:4px;min-width:560px}
      .lib{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px;box-shadow:var(--shadow)}.lib h2{margin:0 0 8px;font:700 22px var(--display);text-transform:uppercase}.li{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}.li .t{flex:1 1 220px;min-width:0;overflow-wrap:anywhere}.li .t small{display:block;color:var(--muted)}
      [data-ai="0"] .ai-only{display:none}
      @media (max-width:900px){.work{grid-template-columns:minmax(0,1fr)}.rail{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding:8px}.rail .prog{display:none}.ri{width:auto;flex:none;white-space:nowrap;border:1px solid var(--line)}.ri .l{display:none}.ri .n{width:auto}.ri[aria-current="step"] .l{display:block}.q{grid-template-columns:3rem minmax(0,1fr)}.qa{grid-column:2;align-items:flex-start}.paper{padding:28px 22px}}
      @media (prefers-reduced-motion:no-preference){.meter i{transition:width .3s}}
    </style>

  <body>
    <div class="wrap" id="app" data-ai="pending">
      <header class="top">
        <div class="brand">
          <svg class="mark" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="7" fill="#0C7547"/><path d="M9 20h16M19 13l7 7-7 7" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M31 10v20" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/></svg>
          <div><h1>FRA Builder</h1><small>Fire risk assessments under the Regulatory Reform (Fire Safety) Order 2005</small></div>
        </div>
        <div class="tabs" role="tablist" aria-label="View">
          <button role="tab" id="tab-a" aria-selected="true" data-tab="assess">Assessment</button>
          <button role="tab" id="tab-r" aria-selected="false" data-tab="report">Report</button>
        </div>
        <div class="tools">
          <button class="btn" id="btn-lib">Library</button>
          <button class="btn" id="btn-new">New assessment</button>
        </div>
      </header>

      <div id="bars"></div>
      <section class="lib" id="lib" hidden></section>

      <div id="view-assess">
        <div class="work">
          <nav class="rail" id="rail" aria-label="Assessment steps"></nav>
          <main class="panel" id="panel"></main>
        </div>
      </div>

      <div id="view-report" hidden>
        <div class="tb">
          <button class="btn primary" id="dl-html">Download report (.html)</button>
          <button class="btn" id="dl-json">Save backup (.json)</button>
          <button class="btn" id="cp-actions">Copy action list</button>
          <span class="msg" id="rep-msg" role="status"></span>
        </div>
        <p class="msg" style="margin:-4px 0 14px">The .html file opens in Word (File, Save As, .docx or PDF) or any browser (Print, Save as PDF).</p>
        <div class="paper-wrap"><article class="paper rpt" id="paper"></article></div>
      </div>
    </div>

    <script>
      (function(){
        'use strict';
        var $=function(s,r){return (r||document).querySelector(s)};
        var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
        var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};

        var RISK=['Trivial','Tolerable','Moderate','Substantial','Intolerable'];
        var WHEN=['','Within 3 months','Within 1 month','ASAP','ASAP'];
        var WHENS=['ASAP','Within 1 month','Within 3 months','Within 6 months'];
        function Q(id,t,k,s,r){return {id:id,t:t,k:k,s:s||0,r:r||''}}
        var SECTIONS=[
          {n:'4',title:'Means of Escape in Case of Fire',short:'Means of escape',note:['The responsible person must ensure that there is adequate means of escape in case of fire.','Regular checks should be made to ensure that escape routes including exits, corridors and stairways are kept free from obstruction.','Checks should also be made to ensure that doors used as fire exits are readily available for use and can be opened in the event of an emergency without the use of keys.','Fire-resisting, self-closing doors should not be wedged or be held open except by approved devices designed to release the doors on the automatic actuation of the fire alarm system.','Fire resisting construction should be checked regularly to ensure that the integrity of the structures is intact.','Compliance with the Equality Act 2010 (formerly the Disability Discrimination Act 1995) for means of escape in case of fire: this report looks to meet the aims and objectives of the Act on a general basis only, by reference to BS 8300, Building Regulations Approved Document M and other supporting data relating to means of escape.'],q:[Q('4.1','Are there an adequate number of stairways?','Y',3,'Provide an adequate number of protected stairways to serve all floors.'),Q('4.2','Do the stairways have adequate fire resisting protection?','Y',3,'Upgrade the stairway enclosure to provide adequate fire resistance (FD30S doors, fire-stopped walls and ceilings).'),Q('4.3','Are all escape stairways kept clear of obstruction?','Y',3,'Remove all obstructions and combustible items from the escape stairway immediately.'),Q('4.4','Are all stairways, corridors and other escape routes used for means of escape free from potential fire hazards?','Y',3,'Remove combustible materials, ignition sources and other fire hazards from all escape routes.'),Q('4.5','Are the coverings to stairways in good condition?','Y',2,'Repair or replace damaged stair coverings to remove trip hazards.'),Q('4.6','Are the nosings on the treads fitted to stairways painted white or yellow?','Y',1,'Fit contrasting white or yellow nosings to the stairway treads.'),Q('4.7','Where more than one escape route is provided, is the maximum route satisfactory? (25 m high risk, 32 m normal sleeping, 45 m normal, 60 m low fire risk)','Y',3,'Reduce the travel distance to the nearest exit or provide an additional protected route.'),Q('4.8','Are there any dead end conditions?','N',2,'Provide adequate protection to the dead end condition or an additional exit.'),Q('4.9','What is the length of the maximum dead end condition? (12 m high risk, 16 m normal sleeping, 18 m normal, 25 m normal factories, 45 m low risk)','T'),Q('4.10','Are dead end conditions adequately protected?','Y',3,'Protect the dead end condition with fire-resisting construction or provide an alternative exit.'),Q('4.11','Are additional alternative exits required?','N',3,'Provide the additional alternative exit(s) identified.'),Q('4.12','Are all fire-resisting doors, except doors to small cupboards, fitted with self-closing devices?','Y',3,'Fit effective overhead self-closing devices to all fire doors (excluding small cupboards).'),Q('4.13','Are all fire-resisting doors in good condition and fitted with 3 fire rated hinges?','Y',3,'Repair or replace damaged fire doors and fit three CE-marked fire-rated hinges to each door.'),Q('4.14','Do all self-closing doors close correctly?','Y',3,'Adjust or repair self-closing devices so that doors close fully into their frames.'),Q('4.15','Are locks fitted to doors to cupboards that are required to be fire resisting?','Y',2,'Fit locks to fire-resisting cupboard doors and keep them locked shut.'),Q('4.16','Are all fire resisting doors fitted with intumescent strips and smoke seals?','Y',2,'Fit intumescent strips and cold smoke seals to all fire doors.'),Q('4.17','Can fire exit doors be opened from the inside without the use of keys?','Y',3,'Ensure all final exit doors can be opened from the inside without a key (for example thumb-turn locks).'),Q('4.18','Do fire exits open in the direction of exit travel where required?','Y',2,'Re-hang exit doors to open in the direction of escape where required.'),Q('4.19','Are there level landings outside fire exits?','I'),Q('4.20','Are fire exits unobstructed on the outside?','Y',3,'Clear all obstructions from outside the fire exits.'),Q('4.21','Can persons using the escape routes from the fire exits leave the curtilage of the premises?','Y',3,'Provide a clear route from the fire exits to a place of safety outside the curtilage of the premises.'),Q('4.22','Are all external escape routes clear of obstruction?','Y',3,'Clear all obstructions from external escape routes.'),Q('4.23','In large floor areas are the escape routes adequately defined?','Y',2,'Clearly define the escape routes across large floor areas.'),Q('4.24','Are there any other matters affecting the means of escape that give cause for concern?','N',2,'Address the following matter affecting means of escape: {note}') ]},{n:'5',title:'Structural Fire Precautions',short:'Structural precautions',note:['The assessment and suitability of material forming elements (e.g. doors, wall partitions) will be in part subjective unless there is documentary evidence confirming their construction. Unless otherwise stated all materials referenced are taken as assumed.','Compliance with the Building Regulations: the layout of the building is commented upon on the assumption of the integrity and stability of external walls, internal partitions, doors and screens. Unless the report states that the structure type is known it must be taken as assumed construction or material.','Adjoining owners: no internal inspection of any adjoining owner’s land or buildings has been undertaken as part of this survey.','Based on visual inspection of readily accessible areas only. No sampling of linings or surfaces has been taken. Assessment of HVAC systems is outside the scope of this report. Roof voids are not inspected unless safe access has been provided by the client.'],q:[Q('5.1','Are fire resisting walls, floors and ceilings free from holes and gaps that would permit the passage of fire?','Y',3,'Make good all holes and gaps in fire-resisting construction with suitable fire-stopping.'),Q('5.2','Are fire-resisting ceilings in sound condition?','Y',2,'Repair damaged fire-resisting ceilings.'),Q('5.3','Are fire-resisting walls adequately fire stopped to the underside of the ceiling or roof?','Y',3,'Fire-stop fire-resisting walls to the underside of the ceiling or roof.'),Q('5.4','Are all linings on walls and ceilings suitable to prevent the surface spread of flame?','Y',2,'Replace wall and ceiling linings that could promote surface spread of flame.'),Q('5.5','Are there balconies?','I'),Q('5.6','Is a lightning protection system installed?','I'),Q('5.7','Are the electrical services adequately enclosed within appropriate fire rated materials?','Y',2,'Enclose electrical services in appropriate fire-rated materials.'),Q('5.8','Are there any other matters that give cause for concern?','N',2,'Address the following structural matter: {note}') ]},{n:'6',title:'Emergency Lighting',short:'Emergency lighting',note:['The responsible person must ensure that the escape routes are adequately lit and that the equipment is inspected and tested.','The emergency lighting system should be energised at least once a month to ensure that all lighting units are working correctly.','The system should be inspected and tested by a competent person every six months and three-yearly in accordance with current codes of practice and any manufacturer’s recommendations.','Lux levels (BS 5266, BS EN 1838, BS EN 50172) and the flame-resistance of luminaires (BS EN 60598-2-22) cannot be confirmed without a calibrated lux meter and manufacturer data, so they are not verified in this report.'],q:[Q('6.1','Is emergency lighting required for this building?','I'),Q('6.2','Is any emergency lighting provided in the premises?','Y',3,'Install emergency lighting to BS 5266-1 to cover all escape routes.'),Q('6.3','Does the emergency lighting system appear to adequately cover the escape routes?','Y',3,'Extend the emergency lighting so that it adequately covers all escape routes.'),Q('6.4','Does the emergency lighting system appear to be working correctly?','Y',3,'Repair the emergency lighting system so that all units work correctly.'),Q('6.5','Is the system energised at least once a month?','Y',1,'The emergency lighting system requires regular testing in accordance with the manufacturer’s recommendations (monthly flick test), recorded in the fire log book.'),Q('6.6','Is the system subject to regular maintenance?','Y',1,'The emergency lighting system requires regular maintenance by a competent person in accordance with the manufacturer’s recommendations and BS 5266-1.'),Q('6.7','Are there any other matters that give cause for concern?','N',2,'Address the following emergency lighting matter: {note}') ]},{n:'7',title:'Fire Alarm System',short:'Fire alarm',note:['The responsible person must ensure that there is adequate means for detecting fire and sounding the alarm and that the equipment is inspected and tested.','The fire alarm system should be tested weekly for function and to check whether the sounders can be heard throughout the building, and inspected and tested quarterly and annually by a competent person.','Based on visual inspection only. No audibility test or verification of full compliance with the relevant British Standard has been carried out.'],q:[Q('7.1','Does the building have an appropriate means of raising the alarm?','Y',3,'Install a fire detection and alarm system appropriate to the premises (BS 5839-1 / BS 5839-6 as applicable).'),Q('7.2','Is the fire alarm tested at least once a week for function?','Y',1,'The fire alarm system requires weekly testing with the results recorded in the fire log book.'),Q('7.3','Does a competent person test the fire alarm annually?','Y',1,'The fire alarm system requires regular servicing by a competent person in accordance with BS 5839 and the manufacturer’s recommendations, with certificates kept.'),Q('7.4','What are the means of detecting fire?','T'),Q('7.5','Are there sufficient call points?','Y',3,'Install additional manual call points where required.'),Q('7.6','Does there appear to be enough automatic detector heads?','Y',3,'Install additional automatic detector heads where required.'),Q('7.7','Where is the main control panel situated?','T'),Q('7.8','Does the panel appear to be working correctly?','Y',3,'Have the control panel repaired or replaced by a competent person.'),Q('7.9','Are there any other matters that give cause for concern?','N',2,'Address the following fire alarm matter: {note}') ]},{n:'8',title:'Fire Equipment & Protection',short:'Fire equipment',note:['The responsible person must ensure that there is adequate means for fighting fire.','Fire extinguishers must be accessible within 30 metres travel and for each 200 square metres.','Daily checks should confirm equipment is in place, undischarged, at the correct pressure and undamaged; weekly checks should confirm safety clips are in place. A competent person should carry out an annual service, an extended service every 5 years, and a major overhaul or replacement every 20 years.'],q:[Q('8.1','Does a competent person check the fire fighting equipment at least once a year?','Y',1,'Arrange an annual check of all fire fighting equipment by a competent person.'),Q('8.2','Is there evidence that the fire extinguishers are subject to regular annual maintenance?','Y',1,'Arrange annual servicing of all fire extinguishers and keep the certificates.'),Q('8.3','Are there sufficient water / foam type extinguishers available (1 for every 200 square metres of floor space)?','Y',2,'Provide sufficient water or foam extinguishers (1 per 200 m² and within 30 m travel).'),Q('8.4','Are there sufficient carbon dioxide extinguishers available for electrical fires?','Y',2,'Provide carbon dioxide extinguishers where there is an electrical fire risk.'),Q('8.5','Are there sufficient wet chemical, fire blanket or dry powder extinguishers available for liquid fires?','Y',2,'Provide wet chemical extinguishers or fire blankets where there is a liquid or cooking fire risk.'),Q('8.6','Are all extinguishers hung on wall brackets or a suitable base plate?','Y',1,'Mount all extinguishers on wall brackets or suitable base plates.'),Q('8.7','Are hose reels installed?','I'),Q('8.8','Are the hose reels tested annually by a competent person?','Y',2,'Arrange annual testing of the hose reels by a competent person.'),Q('8.9','Are the hose, drum and nozzle in good condition?','Y',2,'Repair or replace defective hose reel components.'),Q('8.10','Is there evidence that the hose reels are subject to regular testing?','Y',2,'Keep records of regular hose reel testing.'),Q('8.11','Is a sprinkler system installed?','I'),Q('8.12','Does a competent person regularly check the system?','Y',2,'Arrange regular inspection of the sprinkler system by a competent person.'),Q('8.13','Does the system appear to be in good order?','Y',3,'Have the sprinkler system repaired by a competent person.'),Q('8.14','Is a dry or wet riser installed?','I'),Q('8.15','If yes, does a competent person regularly check the system?','Y',2,'Arrange regular inspection of the riser by a competent person.'),Q('8.16','Does the system appear to be in good order?','Y',3,'Have the riser repaired by a competent person.'),Q('8.17','Is there evidence that the dry or wet riser is subject to regular maintenance & testing?','Y',2,'Keep records of regular riser maintenance and testing.'),Q('8.18','Is there a smoke ventilation system?','I'),Q('8.19','Is the system subject to regular maintenance & testing?','Y',2,'Arrange regular maintenance and testing of the smoke ventilation system.'),Q('8.20','Are there any other matters that give cause for concern?','N',2,'Address the following fire equipment ion notice).'),Q('9.10','Are ‘No Smoking’ signs posted?','Y',1,'Post ‘No Smoking’ signs in the common parts.'),Q('9.11','Do the gas pipes have identification signage applied?','Y',1,'Apply identification signage to the gas pipes.'),Q('9.12','Are there any other matters that give cause for concern?','N',2,'Address the following fire safety sign matter: {note}') ]},{n:'10',title:'Fire Routines & Training',short:'Routines & training',note:['The responsible person must ensure that there is a written fire plan, that people are trained on the action to be taken in the event of fire, that some people are given adequate training on how to use fire fighting equipment and that there is adequate means of liaison with the Fire Brigade.'],q:[Q('10.1','Is there a written fire plan?','Y',2,'Produce a written fire plan and display it as a fire action notice.'),Q('10.2','Is the plan satisfactory?','Y',2,'Revise the fire plan so that it is satisfactory for the premises.'),Q('10.3','Are members of staff given training on fire safety and emergency routines at least once every 6 months?','Y',1,'Provide fire safety and emergency routine training at least every 6 months.'),Q('10.4','Are fire drills conducted regularly? (at least annually)','Y',1,'Carry out a fire drill at least annually and record it.'),Q('10.5','Is there a fire warden system in operation?','Y',1,'Appoint and train fire wardens.'),Q('10.6','Are fire wardens given training on how to operate fire-fighting equipment?','Y',1,'Train fire wardens in the use of fire-fighting equipment.'),Q('10.7','Are there arrangements to assist the Fire Brigade in identifying the risks in the building should a fire occur? E.g. a fire wallet','Y',1,'Consider providing arrangements to assist the Fire Brigade, such as a fire wallet or information box.'),Q('10.8','Are the arrangements for calling the Fire Brigade adequate?','Y',2,'Put adequate arrangements in place for calling the Fire Brigade.'),Q('10.9','Is a logbook kept?','Y',1,'A fire log boo         async function aiSummary(){var m=$('#ai-sum-msg');await capsReady;if(!sample){m.textContent='Claude is not available in this view.';return}var fails=allFails(),ov=overall();if(ov===null){m.textContent='Answer some questions first.';return}ctl=new AbortController();busy('#ai-sum','#ai-stop2','#ai-sum-msg',true,'Writing...');var data={premises:S.g.address||S.g.org,use:S.g.use,type:S.p.type,occupants:S.g.occupants,floors:S.p.floors,overallRisk:RISK[ov],sectionRisks:SECTIONS.map(function(s){return {section:s.title,risk:riskCell(secRisk(s))}}),actions:fails.map(function(f){return {id:f.q.id,finding:f.q.t+' -> '+f.a,note:S.note[f.q.id]||'',action:f.text,timescale:f.when}})};var prompt='You are an experienced UK fire risk assessor writing part of an FRA report under the Regulatory Reform (Fire Safety) Order 2005. Use only the data below. Do not invent findings, standards or measurements. Write in British English, plain professional tone.\n\nDATA:\n'+JSON.stringify(data)+'\n\nReply with only one JSON object: {"summary":"two short paragraphs separated by a blank line: (1) overall conclusion and the risk level, (2) the main actions and their urgency","actions":{"<id>":"clearer wording of that action, one or two sentences, same meaning and same obligations"}}. Include every action id given. Do not change timescales. Cite only these standards where relevant: BS 5839, BS 5266, BS 7671, BS 8214, BS EN 1935.';try{var r=await sample.json(prompt,{signal:ctl.signal,cache:false});if(r&&typeof r.summary==='string'&&r.summary.trim())S.summary=r.summary.trim();var c=0;if(r&&r.actions)Object.keys(r.actions).forEach(function(id){var f=failsFor(QBY[id]||{});if(!QBY[id]||!f)return;var t=r.actions[id];if(typeof t==='string'&&t.trim()){S.ov[id]=S.ov[id]||{};S.ov[id].text=t.trim();c++;}});save();renderPanel();var m2=$('#ai-sum-msg');if(m2)m2.textContent='Summary written and '+c+' actions reworded. Edit anything you like.';}catch(e){busy('#ai-sum','#ai-stop2','#ai-sum-msg',false,aiMsg(e)         function readPhoto(file){return new Promise(function(res,rej){var fr=new FileReader();fr.onload=function(){var img=new Image();img.onload=function(){var k=Math.min(1,800/img.width),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',0.7))};img.onerror=rej;img.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file);});}
        var pending=null;function updateBars(){var h='';if(pending)h+='<div class="bar warn"><p>'+esc(pending.msg)+'</p><button class="btn primary" data-pending="yes">'+esc(pending.yes)+'</button><button class="btn" data-pending="no">Cancel</button></div>';else if(S.example)h+='<div class="bar"><p><b>Example loaded.</b> This is the 11 Fox Street sample report, filled in so you can see how it works. Start a blank assessment when you are ready.</p><button class="btn primary" data-bar="blank">Start blank assessment</button><button class="btn" data-bar="keep">Keep editing this</button></div>';$('#bars').innerHTML=h;}function askConfirm(msg,yes,fn){pending={msg:msg,yes:yes,fn:fn};updateBars()}
        var libOpen=false,libDocs=[],libState='loading',libTimer=0,libMsg='',delId=null;function startLibrary(){libTimer=setTimeout(function(){if(libState==='loading'){libState='slow';renderLib()}},10000);try{db.collection('assessments').orderBy('updated','desc').limit(100).onSnapshot(function(snap){libDocs=snap.docs.map(function(d){var x=d.data()||{};x._id=d.id;return x});if(!snap.metadata.fromCache){clearTimeout(libTimer);libState='ready'}else if(libState==='loading'&&snap.docs.length){libState='ready'}renderLib();},function(e){clearTimeout(libTimer);libState='error';renderLib();});}catch(e){libState='error'}}function renderLib(){var el=$('#lib');if(!libOpen){el.hidden=true;return}el.hidden=false;var h='<h2>Library</h2><div class="row" style="margin-bottom:6px"><button class="btn primary" id="lib-save"'+(db?'':' disabled')+'>Save this assessment</button><label class="btn" for="lib-file">Open a .json backup</label><input type="file" id="lib-file" accept=".json,application/json" hidden><button class="btn ghost" id="lib-close">Close</button><span class="msg" id="lib-msg" role="status">'+esc(libMsg)+'</span></div>';
        if(!db)h+='<p class="msg">Shared saving is not available in this view. Your draft is kept in this browser and you can download a .json backup from the Report tab.</p>';else if(libState==='loading')h+='<p class="msg">Loading saved assessments...</p>';else if(libState==='slow')h+='<p class="msg">Saved assessments could not be reached yet. They may be out of date.</p>';else if(libState==='error')h+='<p class="msg err">Saved assessments could not be loaded.</p>';if(db&&libDocs.length){libDocs.forEach(function(d){var cur=d._id===S.id;h+='<div class="li"><div class="t"><b>'+esc(d.title||'Untitled assessment')+'</b>'+(cur?' <span class="tag">Open now</span>':'')+'<small>'+esc(d.date?fmtDate(d.date):'No date')+' · saved '+esc(new Date(d.updated||0).toLocaleDateString('en-GB'))+'</small></div><span>'+(d.risk!==undefined&&d.risk!==null&&d.risk>=0?chip(d.risk):'')+'</span><button class="btn" data-open="'+esc(d._id)+'">Open</button>'+(delId===d._id?'<button class="btn primary" data-delyes="'+esc(d._id)+'">Confirm delete</button><button class="btn" data-delno="1">Keep</button>':'<button class="btn ghost" data-del="'+esc(d._id)+'">Delete</button>')+'</div>';});}else if(db&&libState==='ready')h+='<div class="empty">No saved assessments yet. Save the one you are working on and it appears here for anyone with access to this page.</div>';el.innerHTML=h;}
        function loadState(obj){if(!obj||!obj.g||!obj.ans)throw new Error('bad');S=obj;S.ai=S.ai||{};S.ov=S.ov||{};S.risk=S.risk||{};S.note=S.note||{};S.example=false;S.a=S.a||{company:'',name:'',quals:'',position:''};save();step=0;renderPanel();updateBars();if(tab==='report')renderReport();}

        document.addEventListener('click',async function(ev){var t=ev.target,b;if((b=t.closest('[data-tab]')))return setTab(b.getAttribute('data-tab'));if((b=t.closest('[data-tab-go]')))return setTab(b.getAttribute('data-tab-go'));if((b=t.closest('.ri')))return go(+b.getAttribute('data-step'));if((b=t.closest('[data-nav]')))return go(step+ +b.getAttribute('data-nav'));if((b=t.closest('[data-go]')))return go(+b.getAttribute('data-go'));if((b=t.closest('.seg button'))){var row=b.closest('.q'),id=row.getAttribute('data-q'),v=b.getAttribute('data-v');if(S.ans[id]===v)delete S.ans[id];else S.ans[id]=v;delete S.ai[id];save();paintSection(SECTIONS[step-1]);renderRail();return;}if(t.id==='ai-fill')return aiFill();if(t.id==='ai-sum')return aiSummary();if(t.id==='ai-stop'||t.id==='ai-stop2'){if(ctl)ctl.abort();return}if(t.id==='photo-rm'){S.photo='';save();renderPanel();return}if(t.id==='btn-new'){return askConfirm('Start a new assessment? Anything not saved to the library or a backup file is lost. Your assessor details are kept.','Start new',function(){S=blank(S.a);save();step=0;renderPanel();updateBars();if(tab==='report')renderReport()})}if(t.id==='btn-lib'){libOpen=!libOpen;libMsg='';renderLib();return}if(t.id==='lib-close'){libOpen=false;renderLib();return}if(t.id==='lib-save'){if(!db)return;try{var ov=overall();await db.doc('assessments/'+S.id).set({title:S.g.address||S.g.org||'Untitled assessment',date:S.g.date||'',risk:ov===null?-1:ov,updated:Date.now(),json:JSON.stringify(S)});libMsg='Saved.';}catch(e){libMsg=(e&&e.code==='quota_exceeded')?'The library is full. Delete an old assessment first.':(e&&e.code==='invalid_argument')?'You can view the library but not save to it.':'Could not save. Try again.'}renderLib();return;}if((b=t.closest('[data-open]'))){var d=libDocs.filter(function(x){return x._id===b.getAttribute('data-open')})[0];try{loadState(JSON.parse(d.json));libMsg='Opened.'}catch(e){libMsg='That assessment could not be opened.'}renderLib();return;}if((b=t.clo
